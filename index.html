      rel="stylesheet"
    />

    <!-- Single Page App GitHub Pages 404 Redirect Handler -->
    <script type="text/javascript">
      // Handles redirection from 404.html on GitHub Pages
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
