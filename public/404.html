<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgriVision DSS - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.

      // If you're creating a Project Pages site, keep pathSegmentsToKeep = 1
      // If you're creating a User/Org Pages site, set pathSegmentsToKeep = 0
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      // If deployed as username.github.io/repo-name/, keep 1 segment (repo-name)
      // If deployed at root domain, keep 0 segments
      if (l.hostname.endsWith('.github.io') && pathSegments.length > 0) {
        pathSegmentsToKeep = 1;
      } else {
        pathSegmentsToKeep = 0;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; color: #1e293b; text-align: center;">
      <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem;">AgriVision DSS & Agricultural AI</h2>
      <p style="color: #64748b; font-size: 0.9rem;">Redirecting to application...</p>
    </div>
  </body>
</html>
